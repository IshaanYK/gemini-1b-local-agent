<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Agent Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <!-- Google Gemini Gradient Sparkle -->
                    <svg class="gemini-sparkle-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gemini-grad)"/>
                        <defs>
                            <linearGradient id="gemini-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#1A73E8"/>
                                <stop offset="0.5" stop-color="#8AB4F8"/>
                                <stop offset="1" stop-color="#C58AF9"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="brand-title">Gemini <span class="brand-badge">Agent 1B</span></span>
                </div>
                
                <div class="header-actions">
                    <div class="model-selector-container">
                        <select id="model-selector" class="model-dropdown">
                            <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash (Fast & Agentic)</option>
                            <option value="gemini-3.5-flash-thinking">Gemini 3.5 Flash Thinking</option>
                            <option value="gemini-3.1-pro">Gemini 3.1 Pro</option>
                            <option value="gemini-flash-lite">Gemini Flash Lite</option>
                        </select>
                    </div>
                    <div class="user-profile-dp" title="User Profile">IS</div>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-sparkle-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#welcome-grad)"/>
                        <defs>
                            <linearGradient id="welcome-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4285F4"/>
                                <stop offset="0.5" stop-color="#9B51E0"/>
                                <stop offset="1" stop-color="#E91E63"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2 class="welcome-heading">Hello, Ishaan</h2>
                <p class="welcome-subtext">How can I help you build today?</p>
                
                <div class="suggestion-grid">
                    <div class="suggestion-card" onclick="setInput('Create a news fetcher script test.py and run it')">
                        <div class="suggestion-icon">⚡</div>
                        <div class="suggestion-text">
                            <p>Build & Run Script</p>
                            <span>Create test.py and execute it</span>
                        </div>
                    </div>
                    <div class="suggestion-card" onclick="setInput('Inspect my local folder structure')">
                        <div class="suggestion-icon">📁</div>
                        <div class="suggestion-text">
                            <p>Inspect Workspace</p>
                            <span>List files and directories</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="messages" id="messages">
                <!-- Messages stream dynamically -->
            </div>
        </main>

        <!-- Footer Input Area -->
        <footer class="input-area">
            <div class="input-container">
                <textarea id="message-input" placeholder="Ask Gemini Agent to build, run commands, or code..." rows="1" autofocus></textarea>
                <button id="send-button" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="footer-text">
                Gemini Agent can execute terminal commands & create files &bull; Powered by Web2API
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
